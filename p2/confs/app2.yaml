apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  labels:
    app: app2
spec:
  replicas: 3

  selector:
    matchLabels:
      app: app2

  template:
    metadata:
      labels:
        app: app2
  
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      
      containers:
        - name: app2
          image: genegrigorian/mmalphit-inception-of-things-app:v1
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_NAME
              value: app2

---
apiVersion: v1
kind: Service
metadata:
  name: app2
spec:
  selector:
    app: app2
  ports:
    - port: 80
      targetPort: http