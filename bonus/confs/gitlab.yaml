apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app: gitlab
spec:
  replicas: 1

  # Kubernetes marks a Deployment ProgressDeadlineExceeded after this long
  # without progress, which makes `kubectl rollout status` fail regardless
  # of its own --timeout. The 600s default is far below GitLab's first-boot
  # time on a small machine.
  progressDeadlineSeconds: 3600

  selector:
    matchLabels:
      app: gitlab

  template:
    metadata:
      labels:
        app: gitlab

    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:latest
          ports:
            - name: http
              containerPort: 80

          env:
            # external_url must match how BOTH Argo CD (in-cluster DNS) and
            # the browser (via /etc/hosts -> 127.0.0.1) reach GitLab, or
            # GitLab issues redirects to an unreachable host.
            # The rest trims GitLab as hard as it goes, for a 4Gi / 1 CPU box.
            # puma worker_processes = 0 runs Puma in single mode (no forked
            # workers), which is the single biggest memory saving available.
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://gitlab.gitlab.svc.cluster.local'
                prometheus_monitoring['enable'] = false
                registry['enable'] = false
                gitlab_pages['enable'] = false
                gitlab_kas['enable'] = false
                puma['worker_processes'] = 0
                sidekiq['max_concurrency'] = 2
                gitlab_rails['monitoring_whitelist'] = ['0.0.0.0/0']

          volumeMounts:
            - name: gitlab
              mountPath: /var/opt/gitlab
              subPath: data
            - name: gitlab
              mountPath: /etc/gitlab
              subPath: config
            - name: gitlab
              mountPath: /var/log/gitlab
              subPath: logs

          # Probe "/" rather than /-/health: GitLab restricts its monitoring
          # endpoints to an IP allowlist and returns 404 to everyone else,
          # including the kubelet. "/" returns 302 (redirect to sign-in),
          # which counts as success for an httpGet probe.
          # GitLab takes 5-10 minutes to boot; failureThreshold *
          # periodSeconds allows ~30 minutes.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
            # GitLab answers in 300-800ms plus queueing; the default
            # timeoutSeconds of 1 cancels the probe mid-request (nginx
            # logs it as 499) and the pod never settles into Ready.
            timeoutSeconds: 10
            failureThreshold: 120

      volumes:
        - name: gitlab
          persistentVolumeClaim:
            claimName: gitlab

---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  type: LoadBalancer
  selector:
    app: gitlab
  ports:
    - name: http
      port: 80
      targetPort: http
