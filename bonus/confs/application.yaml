apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: http://gitlab.gitlab.svc.cluster.local/root/inception-of-things.git
    targetRevision: main
    path: bonus/confs/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
